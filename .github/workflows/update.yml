name: update-channels

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"  # toda segunda 04:00 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerar a Web TV (base + iptv-org atualizado)
        run: node generator/build.mjs

      - name: Commit da lista/player atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public sources
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualiza canais da TV 3.0"
            git push
          fi
